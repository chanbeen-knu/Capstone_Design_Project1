# 예방대책 → 통제위계 키워드 규칙
# 대책 문장에 키워드가 하나라도 있으면 그 통제위계에 연결됩니다 (여러 개 가능).
# 대책은 ▶ 기호로 나눕니다. ▶가 없으면 줄바꿈으로 나눕니다.
levels:
- level: 제거·대체
  keywords:
  - 고소작업대 등을 사용
  - 대체
  - 지상에서
  - 기계화
  - 자동화
  - 원격
  - 최소화
  - 사용하지 않도록
  - 작업을 금지하고 대신
- level: 공학적 대책
  keywords:
  - 설치
  - 덮개
  - 난간
  - 방호
  - 인터록
  - 연동
  - 센서
  - 방망
  - 경보
  - 감지
  - 방지장치
  - 부착
  - 보강
  - 고정
  - 개선
  - 구조로
- level: 관리적 대책
  keywords:
  - 작업계획
  - 계획서
  - 신호수
  - 유도자
  - 교육
  - 감시
  - 점검
  - 확인
  - 출입
  - 통제
  - 금지
  - 지정
  - 배치
  - 절차
  - 휴식
  - 관리
  - 측정
  - 유자격
  - 표지
  - 협의
  - 준수
  - 실시
- level: 개인보호구
  keywords:
  - 안전대
  - 안전모
  - 보호구
  - 안전화
  - 마스크
  - 호흡
  - 보안경
