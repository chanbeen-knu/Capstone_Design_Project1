# 추락 높이 구간
# 재해종류가 추락(또는 상위분류 떨어짐·넘어짐)인 사례의 재해개요에서 높이(m)를 뽑아 구간에 연결합니다.
# min 이상 max 미만. parent는 상위 구간입니다.
# 2m는 산업안전보건기준에 관한 규칙에서 추락 방지 조치(안전난간·작업발판 등)를 요구하는 기준 높이입니다.
bands:
  - name: 2m 미만
    min: 0
    max: 2
    parent: 저고소(2m 미만)
  - name: 2~5m
    min: 2
    max: 5
    parent: 고소(2m 이상)
  - name: 5~10m
    min: 5
    max: 10
    parent: 고소(2m 이상)
  - name: 10m 이상
    min: 10
    max: 300
    parent: 고소(2m 이상)
