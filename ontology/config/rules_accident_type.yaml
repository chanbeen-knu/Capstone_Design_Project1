# 재해종류 규칙
# rewrites: 원본 값을 바꾸는 규칙 (위에서부터 차례로 적용)
# extract: 재해종류 컬럼이 비어 있을 때(제조업 시트) 문장에서 뽑아내는 규칙. 위에서부터 처음 맞는 것을 씁니다.
#   phrase_any = 재해유발요인 문장, summary_any = 재해개요 문장에 포함되면 해당
# classify: 재해종류 단위 상위분류와 다르게, 사례별로 상위분류를 보정하는 규칙 (CLASSIFIED_AS)
rewrites:
- when:
    at:
    - 이상온도 접촉
  set:
    at: 온열질환(폭염)
  note: 원본 이상온도 접촉 → 온열질환으로 재분류
- when:
    at:
    - 온열질환(폭염)
    object_any:
    - 분류불능
    - 분류 불가
  set:
    co: 고온 작업환경(폭염)
  note: 원본 분류불능 → 고온 작업환경(폭염)
