# 사고 패턴 (유사 사고 묶음)
# 같은 기인물(괄호 앞 기본 이름) + 같은 재해종류 + 같은 첫 번째 유발요인인 사례를 하나의 패턴으로 묶습니다.
# 아카이브 6,032건 기준: 5건 이상 패턴 224개가 전체 사례의 77%를 덮습니다.
# 기준을 바꾸면 python ingest.py remap 을 실행하세요.
key: [object, accident_type, hazard]   # 쓸 수 있는 값: object, accident_type, hazard, work
min_size: 5                            # 이 건수 이상만 패턴 노드로 만듭니다
representatives: 2                     # 패턴마다 고를 대표 사례 수
exclude_objects: [분류 불가, 분류불능, 원인미상]   # 기인물을 알 수 없는 사례는 패턴으로 묶지 않음 (카드로 보여 줄 교훈이 약함)

# 대표 사례 점수. 교육·작업자 카드에 쓰기 좋은 사례가 위로 오도록 합니다.
# 점수가 같으면 최근 연도, 사례 번호 순.
score:
  per_control_level: 2.0        # 대책이 다룬 통제위계 종류 수 × 2 (다양한 대책을 보여 줄 수 있음)
  has_engineering: 1.0          # 공학적 대책이 있으면 +1 (보호구에만 기대지 않는 사례)
  per_measure: 0.5              # 대책 수 × 0.5, 최대 4개까지
  max_measures: 4
  original_type: 1.0            # 재해종류가 원본 값이면 +1 (추출·재분류보다 확실)
  summary_len_ok: 0.5           # 개요가 40~220자면 +0.5 (카드에 넣기 알맞은 길이)
  summary_min: 40
  summary_max: 220
  # 두 번째 대표 사례는 가능하면 첫 번째와 업종(제조/건설)이나 작업이 다른 것으로 고릅니다.
  diversify: true
