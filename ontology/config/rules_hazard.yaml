# 재해유발요인 매핑 규칙
# M(제조업 등): 표준 문구(phrase)에서 위에서부터 처음 맞는 규칙 하나를 씁니다.
# C(건설업): 서술문에 맞는 규칙을 모두 모아 최대 max개까지 씁니다. 하나도 없으면 fallback을 위에서부터 봅니다.
# 조건 키: sector, at(재해종류), category(기인물 상위분류), not_category, object_any(기인물 이름 포함),
#          text_any / text_all(유발요인+개요 문장), phrase_any(유발요인 문장), summary_any(개요), any_of(조건 목록 중 하나)
# factor 이름은 hazard_factors.csv에 있어야 합니다.
M:
  mode: first
  rules:
  - factor: 위험 위치 탑승·이동
    phrase_any:
    - 사다리차 운반구
    - 선박 사이
    - 청소차량 후미
    - 운반구(기)에서 작업 또는 이동
    - 승차석이 아닌
    - 나무 위로
    - 적재된 제품·재료 또는 화물 적재함 위
    - 설비를 밟고 올라
    - 승·하강 시 떨어짐
    - 적재함에 탑승
    - 운반하는 물체를 밟고
    - 운반구 탑승
  - factor: 안전대 미체결
    phrase_any:
    - 안전대
  - factor: 사다리 위 균형 상실
    phrase_any:
    - 사다리
  - factor: 휴게·휴식 관리 미흡
    phrase_any:
    - 더운 날씨
  - factor: 설비 미정지·미차단
    phrase_any:
    - 정지시키지 않거나 전원을 차단
    - 잔여 유·공압
  - factor: 정비 중 타인 가동
    phrase_any:
    - 다른 사람이 설비를 가동
  - factor: 추락방지시설 미설치
    phrase_any:
    - 추락방지 시설
    - 안전난간이 없거나
    - 이동경로 상 개구부
    - 작업발판을 설치하지
    - 출입문을 개방
    - 출입문 개방
    - 난간 너머로
  - factor: 안전장치 미설치·해제
    phrase_any:
    - 안전장치가 설치되어 있지 않거나
    - 안전장치의 노후화
    - 날접촉예방장치
  - factor: 발판·자재 파손·탈락
    phrase_any:
    - 밟고 있던 구조물
  - factor: 운행경로 관리 미흡
    phrase_any:
    - 운행경로 상의 지형
    - 지반, 구조물 등이 무너지면서
    - 과속
    - 바닥 경사로
    - 운전미숙
  - factor: 밀폐공간·유해가스 관리 미흡
    phrase_any:
    - 산소·유해가스
    - 낮은 산소농도
    - 유해화학물질·유해가스
    - 잠수작업
    - 음료병
  - factor: 차량·보행자 동선 관리 미흡
    phrase_any:
    - 통행로)를 구분
    - 혼재작업
    - 출입통제 미실시
    - 운전석 이탈
    - 사각지대
    - 이동경로에 근로자의 출입
    - 열차통행
    - 교통법규
    - 외부 차량
    - 출입통제를 실시하지
  - factor: 작업계획·신호수 부재
    phrase_any:
    - 의사소통
    - 시야가 확보되지 않은
  - factor: 설비 용도 외 사용·개조
    phrase_any:
    - 주용도
    - 불법 구조변경
  - factor: 줄걸이·양중 불량
    phrase_any:
    - 줄걸이
    - 양중
    - 인양
    - 훅
  - factor: 점화원·위험물 관리불량
    phrase_any:
    - 점화원
    - 위험물질을 파악
    - 불티비산
    - 누출
    - 합선
    - 반응을 제어
    - 수증기 폭발
    - 화재로 비산
    - 소화약제
    - 배기배관 내 수분
    - 위험물질 및
  - factor: 설비 구조·고정 불량
    phrase_any:
    - 구조부분
    - 고정상태 불량
    - 고장난
    - 분할핀
    - 승강로에 걸려
    - 받침목
    - 금형받침대
    - 역주행
    - 섬유로프 파단
  - factor: 충전부 노출·누전
    phrase_any:
    - 충전부
    - 누설된 전류
    - 고압선
  - factor: 적재물 불안정
    phrase_any:
    - 무게중심이 높은
    - 적재상태가 불량
    - 화물을 지지하던 물체가 파손
    - 벽면 등에 붙은 물질
    - 적재중인 화물
    - 기상상황
    - 상부의 물체의 낙하
  - factor: 바닥 미끄럼·장애물
    phrase_any:
    - 미끄러운 상태의 바닥
    - 요철부
    - 방치된 물체
  - factor: 가공물·부품 비래
    phrase_any:
    - 파손·파단 또는 반동
    - 튕겨나온
    - 조립 불량 또는 부품 파손
    - 이탈하거나 튕겨
    - 휘어진 가공물
    - 힘을 가하던 물체
    - 찔림
  - factor: 자연물(벌도목·낙석 등)
    phrase_any:
    - 벌도목
    - 암석
    - 나무
    - 발파암
    - 독충
    - 조재목
  - factor: 지반·가설구조물 붕괴
    phrase_any:
    - 토사 붕괴
  - factor: 보호구 미착용
    phrase_any:
    - 말릴 위험이 있는 옷
    - 보호구를 착용하지 않은
  - factor: 구동부 접근·오조작
    phrase_any:
    - 수공구 없이 설비의 구동부
    - 주변에서 작동하는 설비
    - 오조작
    - 기계톱
    - 예초기
  default: 기타
C:
  mode: all
  max: 2
  rules:
  - factor: 휴게·휴식 관리 미흡
    at:
    - 온열질환(폭염)
    stop: true
  - factor: 안전대 미체결
    text_all:
    - 안전대
    text_any:
    - 미체결
    - 체결하지
    - 미착용
    - 착용하지
    - 걸지
    - 미사용
    - 체결 하지
    - 체결없이
    - 체결 없이
    - 미설치
  - factor: 사다리 위 균형 상실
    at:
    - 추락
    object_any:
    - 사다리
  - factor: 발판·자재 파손·탈락
    at:
    - 추락
    any_of:
    - category:
      - 지붕·천장
    - text_any:
      - 깨지
      - 파손
      - 부러
      - 탈락
      - 뚫
      - 빠지면서
      - 꺼지
  - factor: 추락방지시설 미설치
    at:
    - 추락
    any_of:
    - category:
      - 개구부·단부
    - text_any:
      - 개구부
      - 단부
      - 난간
      - 방망
      - 덮개
  - factor: 위험 위치 탑승·이동
    at:
    - 추락
    category:
    - 차량·건설기계
    text_any:
    - 탑승
    - 버킷
    - 적재함
  - factor: 지반·가설구조물 붕괴
    at:
    - 붕괴
  - factor: 줄걸이·양중 불량
    at: &id001
    - 깔림
    - 부딪힘
    - 끼임
    - 전도
    category: &id002
    - 차량·건설기계
    - 양중·운반기계
    text_any:
    - 줄걸이
    - 인양
    - 양중
    - 와이어
    - 슬링
    - 훅
    - 달기
  - factor: 줄걸이·양중 불량
    at:
    - 낙하
    any_of:
    - category:
      - 양중·운반기계
    - text_any:
      - 줄걸이
      - 인양
      - 양중
      - 와이어
      - 슬링
      - 훅
      - 달기
      - 크레인
  - factor: 차량·보행자 동선 관리 미흡
    at: *id001
    category: *id002
    text_any:
    - 후진
    - 선회
    - 유도
    - 신호
    - 사각
    - 통제
    - 보행
    - 이동하던
  - factor: 운행경로 관리 미흡
    at: *id001
    category: *id002
    text_any:
    - 전도
    - 넘어
    - 경사
    - 지반
    - 전복
    - 연약
    - 굴러
  - factor: 설비 미정지·미차단
    at: *id001
    category: *id002
    text_any:
    - 수리
    - 정비
    - 점검
    - 청소
  - factor: 설비 미정지·미차단
    at:
    - 끼임
    not_category: *id002
    text_any:
    - 수리
    - 정비
    - 점검
    - 청소
  - factor: 자연물(벌도목·낙석 등)
    at:
    - 낙하
    category:
    - 자연·환경
  - factor: 바닥 미끄럼·장애물
    at:
    - 전도
    category:
    - 구조물
    object_any:
    - 바닥
    - 계단
  - factor: 충전부 노출·누전
    at:
    - 감전
  - factor: 충전부 노출·누전
    at:
    - 화재
    - 폭발
    - 파열
    - 화상
    category:
    - 전기
  - factor: 밀폐공간·유해가스 관리 미흡
    at:
    - 질식
    - 중독
    - 유해물 접촉
  - factor: 점화원·위험물 관리불량
    at:
    - 화재
    - 폭발
    - 파열
    - 화상
    not_category:
    - 전기
  fallback:
  - factor: 추락방지시설 미설치
    at:
    - 추락
  - factor: 작업계획·신호수 부재
    at: *id001
    category: *id002
  - factor: 적재물 불안정
    at:
    - 낙하
  - factor: 구동부 접근·오조작
    at:
    - 끼임
  - factor: 지반·가설구조물 붕괴
    at:
    - 전도
    category:
    - 구조물
    - 가설구조물·가설재
    - 자연·환경
  - factor: 적재물 불안정
    at:
    - 전도
  - factor: 적재물 불안정
    at:
    - 깔림
    - 부딪힘
    category:
    - 자재·중량물
    - 구조물
  - factor: 작업계획·신호수 부재
    at:
    - 깔림
    - 부딪힘
  default: 기타
