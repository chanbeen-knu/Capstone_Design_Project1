# 연도 → 시기 묶음
# 연도 단위로 나눕니다. 중대재해처벌법은 2022년 1월 27일 시행이라, 2022년은 별도 시기로 두었습니다.
# 범위(from, to)는 연도이며 둘 중 하나는 비워도 됩니다. 시기를 바꾸면 python ingest.py remap 을 실행하세요.
periods:
  - name: 중대재해처벌법 시행 전
    to: 2021
  - name: 중대재해처벌법 시행 첫해
    from: 2022
    to: 2022
    note: 2022년 1월 27일 시행. 1월 사례는 시행 전후가 섞여 있음
  - name: 중대재해처벌법 시행 이후
    from: 2023
